name: Build APK and Windows Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Zip Windows bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath clinic_manager_windows.zip

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic_manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic_manager-windows
          path: clinic_manager_windows.zip
